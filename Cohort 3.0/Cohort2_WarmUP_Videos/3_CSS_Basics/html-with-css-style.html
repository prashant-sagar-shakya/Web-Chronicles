<!-- Tells the browser this is an HTML5 document -->
<!DOCTYPE html>
<!-- Specifies that the language of the page is English -->
<html lang="en">
  <head>
    <!-- Sets the character encoding for the page -->
    <meta charset="UTF-8" />
    <!-- Makes the website look good on all devices (phones, tablets, etc.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title shown on the browser tab -->
    <title>HTML with CSS</title>
  </head>
  <body>
    <!-- Main heading tag -->
    <!-- 'style' attribute is used for Inline CSS (styling directly on the tag) -->
    <h1
      style="
        color: red; /* Changes the text color to red */
        background: aqua; /* Changes the background color to aqua */
        border: 1px solid black; /* Adds a 1px thick black border around the heading */
        border-radius: 10px; /* Makes the corners of the border rounded */
        padding: 8px; /* Adds space inside the border (around the text) */
        margin-left: 30px; /* Adds space outside the heading on the left side */
        box-shadow: 2px 10px 10px black; /* Adds a black shadow behind the heading */
      "
    >
      Hello World
    </h1>
  </body>
</html>
