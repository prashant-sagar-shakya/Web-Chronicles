<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        /* Main container settings */
        .container {
            width: 1200px;
            margin: 0 auto;
            /* 'display: grid' turns on CSS Grid layout */
            display: grid;
            /* 'grid-template-columns' defines the columns. 
               '1fr' means 1 part, '2fr' means 2 parts (so the right column is twice as wide). */
            grid-template-columns: 1fr 2fr;
            /* 'gap' adds space between the grid boxes */
            gap: 10px;
        }

        /* Styling for the left box */
        .left {
            background-color: red;
        }

        /* Styling for the right box */
        .right {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- The Left grid item -->
        <div class="left">
            <h1>Left</h1>
        </div>
        <!-- The Right grid item -->
        <div class="right">
            <h1>Right</h1>
        </div>
    </div>
</body>

</html>
